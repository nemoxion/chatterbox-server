[package]
name = "chatterbox-tray"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
  "Win32_System_JobObjects", "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"
] }

[profile.release]
lto = true
strip = true
